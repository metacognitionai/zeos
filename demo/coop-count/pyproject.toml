[project]
name = "zeos-coop-count"
version = "0.1.0"
description = "A llama.cpp MachineBackend for ZEOS, and two agents that count at each other through a pipe"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "zeos",
    "llama-cpp-python>=0.3.35",
    "huggingface-hub>=0.34",
    # The Claude seat only; the local seat needs neither a key nor a network.
    "anthropic>=1.0",
]

[project.scripts]
zeos-count = "zeos_coop_count.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[tool.uv.sources]
zeos = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/zeos_coop_count"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
# Written down rather than inherited: ruff 0.16 changed its defaults.
select = ["E4", "E7", "E9", "F"]
